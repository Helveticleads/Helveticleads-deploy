# Remplacer / fusionner dans chaque server{} qui proxy /api/ vers :3000.
# Ne PAS appliquer tel quel à domisane (:3002) ni nuisibles-suisse (PHP).
#
# Exemple (LWS / IONOS monjardin / terrassement / monextermineur) :

    location /api/ {
        limit_req zone=helvetic_api_leads burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
