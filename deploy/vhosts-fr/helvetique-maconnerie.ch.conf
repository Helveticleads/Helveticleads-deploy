# Vhost préparé — NON ACTIVÉ (déploiement manuel après validation).
# VPS LWS FR : 180.149.199.219
# Prérendu : chaque route possède son index.html (try_files $uri/index.html).

server {
    listen 80;
    listen [::]:80;
    server_name helvetique-maconnerie.ch www.helvetique-maconnerie.ch;
    root /var/www/helvetique-maconnerie.ch/current;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
