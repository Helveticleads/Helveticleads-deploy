# Garde YAML : échoue si un workflow sous .github/workflows/ ne parse pas.
# Attrape la classe de défaut #7 (corps de script colonne 0 dans run: |).
# Uniquement sur PR — pas sur chaque push.
name: actionlint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "ops/verrou-hote/fixtures/**"
      - "ops/verrou-hote/preuve-actionlint.sh"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer actionlint
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint -version

      - name: Lint workflows actuels
        run: actionlint -color .github/workflows/*.yml

      - name: Preuve — la garde attrape le YAML #7
        run: bash ops/verrou-hote/preuve-actionlint.sh
