# Détecteur d'écart entre ce qui est fusionné (main) et ce qui est servi
# (Last-Modified + empreinte sha256 du HTML). Ne publie rien. Ne répare rien.
name: Detecteur ecart fusionne servi

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC — jamais ciblé
  workflow_dispatch:
    inputs:
      mode:
        description: "normal | preuve (injections) | sabotage-auth (jeton vidé)"
        type: choice
        options: [normal, preuve, sabotage-auth]
        default: normal
      ajout_preuve:
        description: "Si true, ajoute un dépôt fictif (preuve dénominateur M)"
        type: boolean
        default: false
      uniquement:
        description: "Mise au point SEULEMENT : repo|domaine. Interdit en schedule. Ne ferme jamais."
        type: string
        default: ""
  push:
    branches: [fix/detecteur-gardes-denom, feat/detecteur-ecart]
    paths:
      - "ops/detecteur-ecart/**"
      - ".github/workflows/detecteur-ecart.yml"
  pull_request:
    paths:
      - "ops/detecteur-ecart/**"
      - ".github/workflows/detecteur-ecart.yml"

permissions:
  contents: read
  issues: write

jobs:
  preuves:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Harness preuves (dry-run — ne ferme jamais l'issue)
        env:
          JETON_LECTURE_DEPOTS: ${{ secrets.JETON_LECTURE_DEPOTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Toujours 1 : un passage ciblé du harness ne doit plus écrire/fermer l'issue.
          DETECTEUR_SKIP_ISSUE: "1"
        run: |
          set -euo pipefail
          chmod +x ops/detecteur-ecart/detecteur.sh ops/detecteur-ecart/preuves.sh
          bash ops/detecteur-ecart/preuves.sh

  detecter:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Détecter les écarts
        env:
          JETON_LECTURE_DEPOTS: ${{ secrets.JETON_LECTURE_DEPOTS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DETECTEUR_MODE: ${{ github.event.inputs.mode || 'normal' }}
          # Schedule : inputs absents → chaîne vide. Jamais de défaut piscine.
          DETECTEUR_UNIQUEMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.uniquement || '' }}
          DETECTEUR_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          MODE="${DETECTEUR_MODE}"
          # Garde schedule : cibler est une erreur fatale (aussi dans detecteur.sh).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            unset DETECTEUR_UNIQUEMENT || true
            export DETECTEUR_UNIQUEMENT=""
            MODE=normal
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            # Push = CI preuves seulement ; pas de balayage flotte ni de ciblage.
            echo "Push — skip job detecter (harness preuves séparé)."
            exit 0
          fi
          if [ "${{ github.event.inputs.ajout_preuve || false }}" = "true" ]; then
            export DETECTEUR_AJOUT_PREUVE=1
            export DETECTEUR_M_PRECEDENT=71
          fi
          if [ "$MODE" = "sabotage-auth" ]; then
            echo "SABOTAGE : jeton vidé pour preuve 401/refus"
            export JETON_LECTURE_DEPOTS=""
            export DETECTEUR_MODE=normal
          else
            export DETECTEUR_MODE="$MODE"
          fi
          # Trace explicite : d'où vient UNIQUEMENT (si non vide).
          if [ -n "${DETECTEUR_UNIQUEMENT:-}" ]; then
            echo "DETECTEUR_UNIQUEMENT actif (workflow_dispatch input 'uniquement') = ${DETECTEUR_UNIQUEMENT}"
            echo "Source YAML : env DETECTEUR_UNIQUEMENT ← github.event.inputs.uniquement (uniquement si event=workflow_dispatch)"
          else
            echo "DETECTEUR_UNIQUEMENT vide — balayage flotte complet"
          fi
          chmod +x ops/detecteur-ecart/detecteur.sh
          bash ops/detecteur-ecart/detecteur.sh

      - name: Afficher le résumé
        if: always()
        run: |
          echo "=== meta ==="
          cat .detecteur-out/meta.txt 2>/dev/null || true
          echo "=== issue ==="
          cat .detecteur-out/issue-url.txt 2>/dev/null || true
          echo "=== tête du rapport ==="
          head -40 .detecteur-out/issue-body.md 2>/dev/null || true
