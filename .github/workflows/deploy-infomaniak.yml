name: Deploy front to Infomaniak VPS

on:
  workflow_call:
    inputs:
      artifact:
        description: "Nom du package pnpm, ex. @workspace/helvetique-patrimoine"
        required: true
        type: string
      domain:
        description: "Domaine, ex. helvetique-patrimoine.ch"
        required: true
        type: string
      host:
        description: "IP du VPS, ex. 179.237.70.246 (FR) ou 179.237.70.207 (DE)"
        required: true
        type: string
      smoke_path:
        description: "Chemin URL post-deploy (defaut /). Ex. /de/ si BASE_PATH=/de"
        required: false
        type: string
        default: "/"
      preuve_sabotage_retire:
        description: "PREUVE UNIQUEMENT — chemin relatif sous dist/public à supprimer après build (ex. anliegen/index.html). La garde anti-perte doit alors refuser avant rsync."
        required: false
        type: string
        default: ""


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ARTIFACT: ${{ inputs.artifact }}
      DOMAIN: ${{ inputs.domain }}
      HOST: ${{ inputs.host }}
      SMOKE_PATH: ${{ inputs.smoke_path }}
    steps:
      # Historique complet : generate-sitemap (et gardes voisines) dérivent lastmod /
      # datation de git log. Sans fetch-depth, checkout prend 1 : une seule date pour
      # tous les fichiers, et la garde refuse. Mesuré : +~0,4 s sur le plus gros dépôt.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build front prerendu
        env:
          PORT: "10000"
          BASE_PATH: "/"
          NODE_ENV: production
          # Ne pas laisser DOMAIN (= inputs.domain) polluer generate-sitemap :
          # sous pnpm --filter, ça préfixe les URLs et fait échouer sitemap-eq.
          DOMAIN: ""
        run: pnpm --filter ${{ inputs.artifact }} run build

      - name: Ref garde sitemap (diagnostic)
        run: |
          echo "job.workflow_repository=${{ job.workflow_repository }}"
          echo "job.workflow_sha=${{ job.workflow_sha }}"
          echo "github.workflow_sha=${{ github.workflow_sha }}"
          echo "github.repository=${{ github.repository }}"
          echo "github.sha=${{ github.sha }}"

      - name: Script garde sitemap (effet)
        uses: actions/checkout@v4
        with:
          # job.workflow_* = dépôt/SHA du workflow RÉUTILISABLE, pas de l'appelant.
          # github.workflow_sha dans un workflow_call rend le SHA de l'appelant
          # (mesuré run 39195484929 : ref=19a20f86 = main de pro-nuisibles → not our ref).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _garde_sitemap
          sparse-checkout: |
            ops/garde-sitemap
            ops/mesure-rendu
          sparse-checkout-cone-mode: false

      - name: Gates build-time
        run: |
          set -euo pipefail
          PKG_DIR="$(pnpm --filter "$ARTIFACT" exec node -e 'process.stdout.write(process.cwd())')"
          SRC="$PKG_DIR/dist/public"
          echo "SRC=$SRC"
          echo "PKG_DIR=$PKG_DIR" >> "$GITHUB_ENV"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

          # 1) index.html present
          test -s "$SRC/index.html" || { echo "GATE_FAIL build:index_html_absent_ou_vide"; exit 1; }

          # 2) asset coherence: each /assets/*.js|css referenced exists locally
          for r in $(grep -oE '/assets/[A-Za-z0-9._-]+\.(js|css)' "$SRC/index.html" | sort -u); do
            test -s "$SRC$r" || { echo "GATE_FAIL build:asset_manquant_ou_vide:$r"; exit 1; }
          done

          # 3) anti bare-ref (SITE_CONFIG page blanche) — FORBIDDEN_BARE_REFS verbatim
          if grep -REl 'SITE_CONFIG\.name|SITE_CONFIG_DE\.name|children:SITE_CONFIG|children:SITE_CONFIG_DE' "$SRC/assets/" 2>/dev/null; then
            echo "GATE_FAIL build:reference_nue_SITE_CONFIG"
            exit 1
          fi

          echo "GATE_OK build_local"

          # Effet sitemap : existe, non vide, URL = prérendu indexable. Aucun nom de script.
          node "$GITHUB_WORKSPACE/_garde_sitemap/ops/garde-sitemap/mesurer-effet.mjs" "$SRC"

          # Preuve volontaire : retirer une URL du bâti APRÈS un build vert,
          # pour que seule la garde anti-perte refuse (avant rsync).
          if [ -n "${{ inputs.preuve_sabotage_retire }}" ]; then
            TARGET="$SRC/${{ inputs.preuve_sabotage_retire }}"
            echo "PREUVE_SABOTAGE retire=$TARGET"
            if [ ! -f "$TARGET" ]; then
              echo "GATE_FAIL preuve_sabotage:fichier_absent:$TARGET"
              exit 1
            fi
            rm -f "$TARGET"
            echo "PREUVE_SABOTAGE_OK removed=$TARGET"
          fi

      - name: Cle SSH de deploiement
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ inputs.host }} >> ~/.ssh/known_hosts 2>/dev/null

      # Scripts verrou : même dépôt/SHA que le workflow réutilisable (pas le caller, pas main flottant).
      # Pas de token : le dépôt doit rester public — un secret nommé ici n'est pas hérité par les
      # appelants et a figé leurs déploiements du 1er au 16 octobre 2026.
      - name: Scripts verrou hôte
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _verrou_hote
          sparse-checkout: |
            ops/verrou-hote
          sparse-checkout-cone-mode: false

      - name: Scripts anti-perte
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _anti_perte
          sparse-checkout: |
            ops/anti-perte
          sparse-checkout-cone-mode: false

      - name: Prendre verrou hôte
        id: verrou
        env:
          HOST: ${{ inputs.host }}
          LOCK_OWNER: ${{ github.repository }}@${{ github.run_id }}
          LOCK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Couverture : sites via ce workflow ; 16 rsync manuels hors verrou.
          SCRIPT="_verrou_hote/ops/verrou-hote/prendre.sh"
          test -f "$SCRIPT"
          OUT=$(mktemp)
          set +e
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes \
            "deploy@${HOST}" \
            "env LOCK_OWNER=$(printf %q "$LOCK_OWNER") LOCK_RUN_URL=$(printf %q "$LOCK_RUN_URL") STALE_SEC=3600 WAIT_MAX_SEC=5400 WAIT_POLL_SEC=15 bash -s" \
            < "$SCRIPT" | tee "$OUT"
          rc=${PIPESTATUS[0]}
          set -e
          if grep -q '^LOCK_HELD=1$' "$OUT"; then
            echo "held=1" >> "$GITHUB_OUTPUT"
          else
            echo "held=0" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Deploiement atomique gaté
        env:
          LOCK_OWNER: ${{ github.repository }}@${{ github.run_id }}
        run: |
          set -euo pipefail
          # Battement : session ssh tenue par ce step, sans nohup.
          # La fin du step ou la mort du runner coupe ssh ; SIGHUP tue la boucle.
          HB_PID=""
          stop_hb() {
            if [ -n "${HB_PID:-}" ]; then
              kill "$HB_PID" 2>/dev/null || true
              wait "$HB_PID" 2>/dev/null || true
              HB_PID=""
            fi
          }
          if [ "${{ steps.verrou.outputs.held }}" = "1" ]; then
            ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes               "deploy@${HOST}"               "env LOCK_OWNER=$(printf %q "$LOCK_OWNER") bash -s"               < "_verrou_hote/ops/verrou-hote/battement.sh" &
            HB_PID=$!
          fi
          trap stop_hb EXIT
          TS=$(date +%Y%m%d-%H%M%S)
          BASE="/var/www/$DOMAIN"
          SSH_OPTS=(-i ~/.ssh/id_ed25519)
          SSH_CMD=(ssh "${SSH_OPTS[@]}" "deploy@$HOST")
          RSYNC_SSH="ssh -i ~/.ssh/id_ed25519"

          retry() {
            local n=0 max=4
            until "$@"; do
              n=$((n + 1))
              [ "$n" -ge "$max" ] && return 1
              sleep $(( (2**n) + (RANDOM % 4) ))
              echo "retry $n/$max…"
            done
          }

          rollback() {
            # Même script que les preuves locales — exécuté sur l'hôte.
            "${SSH_CMD[@]}" \
              "env BASE=$(printf %q "$BASE") PREV=$(printf %q "${PREV:-}") bash -s" \
              < "_anti_perte/ops/anti-perte/rollback.sh"
          }

          echo "Source build : $SRC"

          if ! "${SSH_CMD[@]}" "true" 2>/dev/null; then
            echo "GATE_FAIL anti_perte:hote_injoignable"
            exit 1
          fi

          PREV="$("${SSH_CMD[@]}" "readlink '$BASE/current'" 2>/dev/null || true)"
          echo "PREV=$PREV"

          # Lectures SSH → paramètres ; décision = ops/anti-perte/decider.sh
          # Release complète = index.html non vide (placeholder nu ≠ servi).
          COMPLETE_RELEASE="$("${SSH_CMD[@]}" \
            "find '$BASE/releases' -mindepth 2 -maxdepth 2 -name index.html -size +0 2>/dev/null | head -n1" || true)"
          PREV_AVEC_PAGES=0
          if [ -n "$PREV" ] && [ "$PREV" != "$BASE/current" ] \
            && "${SSH_CMD[@]}" "test -d '$PREV'" \
            && "${SSH_CMD[@]}" "find '$PREV' -maxdepth 2 -name index.html -size +0 2>/dev/null | grep -q ."; then
            PREV_AVEC_PAGES=1
          fi

          ANTI_PERTE_STATUS=""
          SERVI=$(mktemp); BATI=$(mktemp); CAND=$(mktemp)
          trap 'rm -f "$SERVI" "$BATI" "$CAND"; stop_hb' EXIT
          (cd "$SRC" && find -L . -name index.html | sed 's|^\./||;s|/index.html$||;s|^index.html$|/|' | LC_ALL=C sort) > "$BATI"
          NB=$(grep -c . "$BATI" || true)
          if [ "$NB" -eq 0 ]; then
            echo "GATE_FAIL anti_perte:bati=0 (build vide)"
            exit 1
          fi

          # exit 2 = continuer : capturer sans que set -e tue le job (APPEL-WORKFLOW.md).
          set +e
          DEC_OUT=$(PREV="$PREV" PREV_AVEC_PAGES="$PREV_AVEC_PAGES" \
            COMPLETE_RELEASE="$COMPLETE_RELEASE" \
            bash "_anti_perte/ops/anti-perte/decider.sh" 2>&1)
          DEC_RC=$?
          set -e
          printf '%s\n' "$DEC_OUT"
          if [ "$DEC_RC" -eq 0 ]; then
            # premiere_release | hote_provisionne — même décision, diagnostic distinct
            ANTI_PERTE_STATUS=$(printf '%s\n' "$DEC_OUT" | grep -E '^GATE_SKIP anti_perte:' | head -n1)
            ANTI_PERTE_STATUS="${ANTI_PERTE_STATUS:-GATE_SKIP anti_perte:premiere_release}"
          elif [ "$DEC_RC" -eq 1 ]; then
            exit 1
          elif [ "$DEC_RC" -eq 2 ]; then
            # ── Garde anti-perte (site déjà servi) ──
            # Aucune URL indexée servie ne doit disparaître SANS 301 HTTP
            # vérifiée vers une cible du bâti. Mesure, pas checklist.
            if ! "${SSH_CMD[@]}" \
              "cd '$BASE/current' && find -L . -name index.html | sed 's|^\\./||;s|/index.html\$||;s|^index.html\$|/|' | LC_ALL=C sort" \
              > "$SERVI" 2>/dev/null; then
              echo "GATE_FAIL anti_perte:current_absent"
              exit 1
            fi
            NS=$(grep -c . "$SERVI" || true)
            if [ "$NS" -eq 0 ]; then
              echo "GATE_FAIL anti_perte:servi_vide"
              exit 1
            fi
            comm -23 "$SERVI" "$BATI" > "$CAND"

            # path inventaire → URL. Sonde LES DEUX formes (avec/sans "/") :
            # une location = sans variante "/" laisse encore répondre 200.
            path_to_url() {
              local p="$1"
              if [ "$p" = "/" ]; then echo "https://$DOMAIN/"; else echo "https://$DOMAIN/$p"; fi
            }
            # Location → path inventaire (sans slash final, sauf "/").
            loc_to_path() {
              local loc="$1" path
              path=$(printf '%s' "$loc" | sed -E 's|^[a-zA-Z]+://[^/]+||; s|\?.*||; s|#.*||')
              [ -z "$path" ] && path="/"
              if [ "$path" != "/" ]; then path=$(printf '%s' "$path" | sed 's|/$||'); path=${path#/}; fi
              printf '%s' "$path"
            }
            # Suit au plus 2 sauts 301/308. Succès si une cible tombe dans BATI.
            follow_migration() {
              local url="$1" hops=0 code loc path
              while [ "$hops" -lt 2 ]; do
                code=$(curl -sS -o /dev/null -D /tmp/anti_perte_hdrs -w '%{http_code}' \
                  --max-time 15 -H 'Cache-Control: no-store' "$url" || echo 000)
                case "$code" in
                  301|308) ;;
                  *) return 1 ;;
                esac
                loc=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' \
                  /tmp/anti_perte_hdrs)
                [ -n "$loc" ] || return 1
                case "$loc" in
                  http://*|https://*)
                    case "$loc" in
                      "http://$DOMAIN"|"http://$DOMAIN/"*|"https://$DOMAIN"|"https://$DOMAIN/"*) ;;
                      *) return 1 ;;
                    esac
                    ;;
                  /*) loc="https://$DOMAIN$loc" ;;
                  *) return 1 ;;
                esac
                path=$(loc_to_path "$loc")
                if grep -Fxq "$path" "$BATI"; then
                  printf '%s' "$path"
                  return 0
                fi
                url="$loc"
                hops=$((hops + 1))
              done
              return 1
            }
            # Les deux formes doivent migrer (sauf "/"). Diagnostics → stderr ;
            # stdout = uniquement la cible inventaire si OK.
            probe_one_form() {
              local url="$1" code
              code=$(curl -sS -o /dev/null -D /tmp/anti_perte_hdrs -w '%{http_code}' \
                --max-time 15 -H 'Cache-Control: no-store' "$url" || echo 000)
              case "$code" in
                301|308)
                  if cible=$(follow_migration "$url"); then
                    echo "ok:$cible"
                    return 0
                  fi
                  echo "fail:301_cible_hors_bati_ou_chaine"
                  return 1
                  ;;
                *)
                  echo "fail:http_$code"
                  return 1
                  ;;
              esac
            }
            probe_both_forms() {
              local p="$1" u0 r0 r1 c0
              if [ "$p" = "/" ]; then
                r0=$(probe_one_form "https://$DOMAIN/") || {
                  echo "  sonde: / → $r0" >&2
                  return 1
                }
                c0=${r0#ok:}
                echo "  sonde: / → 301→$c0" >&2
                printf '%s' "$c0"
                return 0
              fi
              u0=$(path_to_url "$p")
              r0=$(probe_one_form "$u0") || true
              r1=$(probe_one_form "$u0/") || true
              echo "  sonde: /$p → $r0" >&2
              echo "  sonde: /$p/ → $r1" >&2
              case "$r0" in ok:*) ;; *) return 1 ;; esac
              case "$r1" in ok:*) ;; *) return 1 ;; esac
              c0=${r0#ok:}
              printf '%s' "$c0"
              return 0
            }

            MIGREES=0
            PERDUES=0
            while IFS= read -r p || [ -n "$p" ]; do
              [ -z "$p" ] && continue
              if cible=$(probe_both_forms "$p"); then
                MIGREES=$((MIGREES + 1))
                echo "  migree: $p → $cible"
              else
                PERDUES=$((PERDUES + 1))
                echo "  manquante: $p (pas de 301→bati sur les deux formes)"
              fi
            done < "$CAND"

            if [ "$PERDUES" -gt 0 ]; then
              echo "GATE_FAIL anti_perte:perdues=$PERDUES migrees=$MIGREES servi=$NS bati=$NB — déploiement refusé"
              exit 1
            fi
            echo "GATE_OK anti_perte servi=$NS bati=$NB perdues=0 migrees=$MIGREES"
            ANTI_PERTE_STATUS="GATE_OK anti_perte servi=$NS bati=$NB"
          else
            echo "GATE_FAIL anti_perte:decider_rc_inattendu:$DEC_RC"
            exit 1
          fi

          retry rsync -avz --delete \
            -e "$RSYNC_SSH" \
            "$SRC/" \
            "deploy@$HOST:$BASE/releases/$TS/"

          # Bascule atomique : rename() via tmp — pas de fenêtre où current
          # n'existe pas (ln -sfn = unlink puis symlink → 404 possible).
          retry "${SSH_CMD[@]}" \
            "ln -sfn '$BASE/releases/$TS' '$BASE/.current.tmp' && mv -Tf '$BASE/.current.tmp' '$BASE/current'"
          echo "GATE_OK symlink"

          # Courte pause : laisse nginx / éventuel cache fichier digérer la bascule.
          sleep 2

          CURL_NOSTORE=(curl -fsS -H 'Cache-Control: no-store' -H 'Pragma: no-cache')

          # --- post-bascule gates ---
          # Le HTML servi peut rester brièvement périmé (open_file_cache / proxy).
          # On exige un 200 + #root, mais les assets se lisent depuis le BUILD
          # qu'on vient d'uploader ($SRC/index.html) — jamais depuis un HTML
          # HTTP éventuellement ancien, sinon GATE_FAIL sur un hash obsolète
          # absent de la nouvelle release (vu garten 2026-09-16, run 35055051643).
          code=$("${CURL_NOSTORE[@]}" -o /tmp/root.html -w '%{http_code}' "https://$DOMAIN$SMOKE_PATH" || echo 000)
          if [ "$code" != "200" ]; then
            echo "GATE_FAIL post:http_root:$code"
            rollback
            exit 1
          fi
          # Effet rendu (HTML servi) — textLen≥200 ET elements≥20 ; plus #root.
          if ! node "$GITHUB_WORKSPACE/_garde_sitemap/ops/mesure-rendu/mesurer-rendu.mjs" /tmp/root.html; then
            echo "GATE_FAIL post:rendu_insuffisant"
            rollback
            exit 1
          fi
          echo "GATE_OK post_http_root"

          for r in $(grep -oE '/assets/[A-Za-z0-9._-]+\.(js|css)' "$SRC/index.html" | sort -u); do
            ac=000
            for attempt in 1 2 3; do
              ac=$("${CURL_NOSTORE[@]}" -o /dev/null -w '%{http_code}' "https://$DOMAIN$r" || echo 000)
              [ "$ac" = "200" ] && break
              sleep $((attempt * 2))
            done
            if [ "$ac" != "200" ]; then
              echo "GATE_FAIL post:asset:$r:$ac"
              rollback
              exit 1
            fi
          done
          echo "GATE_OK post_assets"

          # --- Gate rendu : Playwright (install ISOLÉ /tmp, hors workspace pnpm), heuristique en repli ---
          render_ok=""
          prov_ok=""
          PW_DIR=/tmp/pw
          mkdir -p "$PW_DIR"
          if ( cd "$PW_DIR" && npm init -y >/dev/null 2>&1 && npm install playwright >/tmp/pwnpm.log 2>&1 ) \
             && ( cd "$PW_DIR" && npx playwright install --with-deps chromium >/tmp/pwbin.log 2>&1 ); then
            prov_ok=1
          else
            echo "render: provisioning Playwright KO -> repli heuristique"
            echo "----- pwnpm.log (tail) -----"; tail -n 25 /tmp/pwnpm.log 2>/dev/null || true
            echo "----- pwbin.log (tail) -----"; tail -n 25 /tmp/pwbin.log 2>/dev/null || true
          fi
          if [ -n "$prov_ok" ]; then
            set +e
            U="https://$DOMAIN$SMOKE_PATH" NODE_PATH="$PW_DIR/node_modules" node -e '
              const { chromium } = require("playwright");
              (async () => {
                const b = await chromium.launch({ args: ["--no-sandbox"] });
                const p = await b.newPage();
                const errs = [];
                p.on("pageerror", e => errs.push(String(e)));
                let nav = false;
                for (let i = 1; i <= 3 && !nav; i++) {
                  try {
                    await p.goto(process.env.U, { waitUntil: "domcontentloaded", timeout: 30000 });
                    nav = true;
                  } catch (e) {
                    console.error("PW_NAV_RETRY " + i + "/3", String(e));
                    if (i < 3) await new Promise(r => setTimeout(r, 2000 * i));
                  }
                }
                if (!nav) { console.error("PW_INFRA_NAV", "goto échoué après 3 tentatives"); await b.close(); process.exit(3); }
                let ok = false;
                try {
                  await p.waitForFunction(() => {
                    const body = document.body;
                    if (!body) return false;
                    const clone = body.cloneNode(true);
                    clone.querySelectorAll("script,style,noscript").forEach((n) => n.remove());
                    const text = (clone.textContent || "").replace(/\s+/g, " ").trim();
                    const elements = clone.querySelectorAll("*").length;
                    return text.length >= 200 && elements >= 20;
                  }, { timeout: 20000 });
                  ok = true;
                } catch (e) { ok = false; }
                const m = await p.evaluate(() => {
                  const body = document.body;
                  if (!body) return { textLen: 0, elements: 0 };
                  const clone = body.cloneNode(true);
                  clone.querySelectorAll("script,style,noscript").forEach((n) => n.remove());
                  const textLen = (clone.textContent || "").replace(/\s+/g, " ").trim().length;
                  return { textLen, elements: clone.querySelectorAll("*").length };
                });
                console.log("PW_MESURE_RENDU textLen=" + m.textLen + " elements=" + m.elements);
                await b.close();
                if (errs.length) console.error("PW_PAGEERRORS", JSON.stringify(errs));
                if (!ok) { console.error("RENDER_INSUFFISANT"); process.exit(2); }
                process.exit(0);
              })().catch(e => { console.error("PW_INFRA", String(e)); process.exit(3); });
            '
            rc=$?
            set -e
            if   [ "$rc" = 0 ]; then echo "GATE_OK render_playwright"; render_ok=1
            elif [ "$rc" = 2 ]; then echo "GATE_FAIL render_playwright:page"; rollback; exit 1
            else                      echo "render: Playwright infra KO (rc=$rc) -> repli heuristique"
            fi
          fi
          if [ -z "$render_ok" ]; then
            # Repli : même critère sur le HTML déjà téléchargé (post_http_root).
            if node "$GITHUB_WORKSPACE/_garde_sitemap/ops/mesure-rendu/mesurer-rendu.mjs" /tmp/root.html; then
              echo "GATE_OK render_heuristic"
              render_ok=1
            else
              echo "GATE_FAIL render_heuristic:rendu_insuffisant"
              rollback
              exit 1
            fi
          fi

          # --- retention (5 releases) — only after all gates pass ---
          "${SSH_CMD[@]}" "ls -1dt $BASE/releases/*/ | tail -n +6 | xargs -r rm -rf"

          echo "Deploye : $DOMAIN -> release $TS"
          echo "=== GATE_RECAP ==="
          echo "GATE_OK build_local"
          echo "${ANTI_PERTE_STATUS:-GATE_OK anti_perte}"
          echo "GATE_OK symlink"
          echo "GATE_OK post_http_root"
          echo "GATE_OK post_assets"
          echo "GATE_OK render"
          echo "GATE_OK deploy_complete"

      - name: Relâcher verrou hôte
        if: always() && steps.verrou.outputs.held == '1'
        env:
          HOST: ${{ inputs.host }}
          LOCK_OWNER: ${{ github.repository }}@${{ github.run_id }}
        run: |
          set -euo pipefail
          SCRIPT="_verrou_hote/ops/verrou-hote/relacher.sh"
          test -f "$SCRIPT"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o IdentitiesOnly=yes \
            "deploy@${HOST}" \
            "env LOCK_OWNER=$(printf %q "$LOCK_OWNER") bash -s" \
            < "$SCRIPT"
