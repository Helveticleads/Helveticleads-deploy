# Preuve : checkout sparse de ops/verrou-hote sans token: (dépôt public).
name: preuve-verrou-checkout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preuve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sparse ops/verrou-hote (sans token)
        uses: actions/checkout@v4
        with:
          repository: Helveticleads/Helveticleads-deploy
          path: _verrou_hote
          sparse-checkout: |
            ops/verrou-hote
          sparse-checkout-cone-mode: false

      - name: Lister scripts verrou
        run: |
          set -euo pipefail
          ls -la _verrou_hote/ops/verrou-hote/
          test -f _verrou_hote/ops/verrou-hote/prendre.sh
          test -f _verrou_hote/ops/verrou-hote/relacher.sh
          echo "PREUVE_OK prendre.sh et relacher.sh presents"
